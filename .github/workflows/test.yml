name: Tests

on:
  push:
    # A tag is the same commit its branch push already tests
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported (package.json's engines: type stripping, node:sqlite) and the newest
        node: ['24', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Offline: providers replay recorded responses. The page's browser test uses the runner's Chrome
      # (/usr/bin/google-chrome); the shell's, which needs Electron and Xvfb, skips itself.
      - run: npm run test:brief
      # The sources and the renderer (DOM, no Node types); the shell's typecheck needs shell/node_modules and stays local
      - run: npm run typecheck
